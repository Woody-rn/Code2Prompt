prompt.find_bugs=\u041F\u0440\u043E\u0430\u043D\u0430\u043B\u0438\u0437\u0438\u0440\u0443\u0439 \u043A\u043E\u0434 \u043F\u0440\u043E\u0435\u043A\u0442\u0430. \u041D\u0430\u0439\u0434\u0438 \u0431\u0430\u0433\u0438, \u0443\u044F\u0437\u0432\u0438\u043C\u043E\u0441\u0442\u0438 \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438, \u0443\u0442\u0435\u0447\u043A\u0438 \u043F\u0430\u043C\u044F\u0442\u0438, \u043D\u0435\u043E\u0431\u0440\u0430\u0431\u043E\u0442\u0430\u043D\u043D\u044B\u0435 \u0438\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u0438 \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u044B \u0441 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u044C\u044E. \u0414\u043B\u044F \u043A\u0430\u0436\u0434\u043E\u0439 \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u044B \u0443\u043A\u0430\u0436\u0438 \u0444\u0430\u0439\u043B, \u0441\u0442\u0440\u043E\u043A\u0443 \u0438 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438 \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435.
prompt.refactor=\u041F\u0440\u043E\u0432\u0435\u0434\u0438 \u0440\u0435\u0444\u0430\u043A\u0442\u043E\u0440\u0438\u043D\u0433 \u043A\u043E\u0434\u0430: \u0443\u0441\u0442\u0440\u0430\u043D\u0438 \u0434\u0443\u0431\u043B\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435, \u0443\u043F\u0440\u043E\u0441\u0442\u0438 \u0441\u043B\u043E\u0436\u043D\u044B\u0435 \u043C\u0435\u0442\u043E\u0434\u044B, \u043F\u0440\u0438\u043C\u0435\u043D\u0438 \u043F\u043E\u0434\u0445\u043E\u0434\u044F\u0449\u0438\u0435 \u043F\u0430\u0442\u0442\u0435\u0440\u043D\u044B \u043F\u0440\u043E\u0435\u043A\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F, \u0443\u043B\u0443\u0447\u0448\u0438 \u0447\u0438\u0442\u0430\u0435\u043C\u043E\u0441\u0442\u044C. \u041F\u0440\u0435\u0434\u043B\u043E\u0436\u0438 \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u044B\u0435 \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u044F \u0441 \u043F\u043E\u044F\u0441\u043D\u0435\u043D\u0438\u044F\u043C\u0438.
prompt.documentation=\u0421\u0433\u0435\u043D\u0435\u0440\u0438\u0440\u0443\u0439 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430\u0446\u0438\u044E \u0434\u043B\u044F \u043F\u0440\u043E\u0435\u043A\u0442\u0430: \u043E\u043F\u0438\u0448\u0438 \u0430\u0440\u0445\u0438\u0442\u0435\u043A\u0442\u0443\u0440\u0443, \u043E\u0441\u043D\u043E\u0432\u043D\u044B\u0435 \u043A\u043B\u0430\u0441\u0441\u044B \u0438 \u0438\u0445 \u0432\u0437\u0430\u0438\u043C\u043E\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435. \u0414\u043E\u0431\u0430\u0432\u044C JavaDoc \u0434\u043B\u044F \u0432\u0441\u0435\u0445 \u043F\u0443\u0431\u043B\u0438\u0447\u043D\u044B\u0445 \u043C\u0435\u0442\u043E\u0434\u043E\u0432 \u0438 \u043A\u043B\u0430\u0441\u0441\u043E\u0432.
prompt.explain=\u041E\u0431\u044A\u044F\u0441\u043D\u0438 \u0430\u0440\u0445\u0438\u0442\u0435\u043A\u0442\u0443\u0440\u0443 \u043F\u0440\u043E\u0435\u043A\u0442\u0430: \u043A\u0430\u043A\u0438\u0435 \u043F\u0430\u0442\u0442\u0435\u0440\u043D\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442\u0441\u044F, \u043A\u0430\u043A \u0432\u0437\u0430\u0438\u043C\u043E\u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044E\u0442 \u043A\u043E\u043C\u043F\u043E\u043D\u0435\u043D\u0442\u044B, \u043A\u0430\u043A\u0438\u0435 \u0435\u0441\u0442\u044C \u0441\u0438\u043B\u044C\u043D\u044B\u0435 \u0438 \u0441\u043B\u0430\u0431\u044B\u0435 \u0441\u0442\u043E\u0440\u043E\u043D\u044B. \u041E\u043F\u0438\u0448\u0438 \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0443 \u043F\u0440\u043E\u0441\u0442\u044B\u043C \u044F\u0437\u044B\u043A\u043E\u043C.
