help.what.text=Code2Prompt \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u0442 \u0444\u0430\u0439\u043B\u044B \u043F\u0440\u043E\u0435\u043A\u0442\u0430 \u0432 txt, \u0440\u0430\u0437\u0431\u0438\u0432\u0430\u0435\u0442 \u043D\u0430 \u0447\u0430\u0441\u0442\u0438 \u0438 \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u0435\u0442 \u0432 AI-\u0447\u0430\u0442 \u0447\u0435\u0440\u0435\u0437 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u043D\u043E\u0435 \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043D\u0438\u0435.
