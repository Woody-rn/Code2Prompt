help.how.text=1. \u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u043F\u0430\u043F\u043A\u0443 \u0441 \u043F\u0440\u043E\u0435\u043A\u0442\u043E\u043C \u2192 \u0421\u0422\u0410\u0420\u0422\n2. \u041D\u0430\u0436\u043C\u0438\u0442\u0435 \uD83D\uDE80 \u0417\u0430\u043F\u0443\u0441\u0442\u0438\u0442\u044C \u0441\u0435\u0440\u0432\u0435\u0440\n3. \u041E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 chat.deepseek.com\n4. \u041D\u0430\u0436\u043C\u0438\u0442\u0435 Ctrl+Enter \u0432 \u0447\u0430\u0442\u0435
help.cert=\u0417\u0430\u0447\u0435\u043C \u0441\u0435\u0440\u0442\u0438\u0444\u0438\u043A\u0430\u0442?
help.cert.text=\u0414\u043B\u044F HTTPS \u043C\u0435\u0436\u0434\u0443 \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043D\u0438\u0435\u043C \u0438 \u0441\u0435\u0440\u0432\u0435\u0440\u043E\u043C. \u0421\u0435\u0440\u0442\u0438\u0444\u0438\u043A\u0430\u0442 \u0441\u0430\u043C\u043E\u043F\u043E\u0434\u043F\u0438\u0441\u0430\u043D\u043D\u044B\u0439 \u2014 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0434\u0438\u0442, \u044D\u0442\u043E \u043D\u043E\u0440\u043C\u0430\u043B\u044C\u043D\u043E. \u041D\u0443\u0436\u043D\u043E \u043E\u0434\u0438\u043D \u0440\u0430\u0437 \u043D\u0430\u0436\u0430\u0442\u044C \u00AB\u041F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C\u00BB \u043D\u0430 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0435 localhost:9090.
help.extension=\u041A\u0430\u043A \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043D\u0438\u0435?
